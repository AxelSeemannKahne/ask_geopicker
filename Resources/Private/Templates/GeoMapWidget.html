<div class="askgeo-widget"
     data-latitude-field="{latitudeField}"
     data-longitude-field="{longitudeField}"
     data-address-template="{addressTemplate}">

    <f:if condition="{addressTemplate}">
        <button type="button" class="btn btn-default askgeo-geocode-button mb-3">
            <f:translate key="LLL:EXT:ask_geopicker/Resources/Private/Language/locallang.xlf:askgeo.geocodeButton" />
        </button>
    </f:if>

    <div class="askgeo-map"></div>
</div>
